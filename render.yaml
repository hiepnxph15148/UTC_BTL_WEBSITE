# Render Blueprint — ShoeStore API + Postgres
# Docs: https://render.com/docs/blueprint-spec
#
# Sau khi merge/push: Render Dashboard → New → Blueprint → chọn repo này.
# Hoặc: https://dashboard.render.com/select-repo?type=blueprint

databases:
  - name: shoestore-db
    plan: free
    databaseName: shoestore
    user: shoestore
    # Dump local là Postgres 17 — nếu restore lỗi version, dùng Neon PG17 (xem RENDER.md)
    postgresMajorVersion: "16"

services:
  - type: web
    name: shoestore-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/api/Dockerfile
    dockerContext: ./backend/api
    healthCheckPath: /health-status
    # Free tier sleep khi idle — cold start .NET có thể 1–2 phút
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_EnableDiagnostics
        value: "0"
      - key: ConnectionStrings__Default
        fromDatabase:
          name: shoestore-db
          property: connectionString
      # Đổi domain nếu Render gán tên khác (Settings → service URL)
      - key: App__SelfUrl
        value: https://shoestore-api.onrender.com
      - key: AuthServer__Authority
        value: https://shoestore-api.onrender.com
      - key: AuthServer__RequireHttpsMetadata
        value: "false"
      - key: AuthServer__CertificatePassPhrase
        value: 2cbe0f83-e7b2-4bfb-bede-ed58d00ee548
      - key: StringEncryption__DefaultPassPhrase
        value: YqRngVpyXMlauwff
